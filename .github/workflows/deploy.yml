# Deploys the site to Firebase every time something is pushed to the main branch.
# Needs ONE secret in GitHub: FIREBASE_SERVICE_ACCOUNT (the whole service-account .json file contents).
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:        # also lets you press "Run workflow" by hand in the Actions tab

# never run two deploys at once
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # always rebuild syllabus.json from data/syllabus.txt so the live site can never be out of date with the outline
      - name: Rebuild syllabus.json
        run: python3 -I scripts/build_syllabus.py data/syllabus.txt public/syllabus.json

      - name: Deploy (hosting + Firestore rules)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set (GitHub repo -> Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.36.0 deploy --only firestore:rules,hosting --project gate-ece-tracker-v --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
